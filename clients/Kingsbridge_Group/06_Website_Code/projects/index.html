<body data-page="projects">
<div class="page-veil" id="page-veil"><div class="pv-inner"><img class="pv-mark" src="/assets/img/logo/kingsbridge-icon.png" alt=""><span class="pv-line"></span></div></div>


<div id="header-root"></div>

<section class="page-header">
  <div class="container">
    <span class="eyebrow">Concept Collection</span>
    <h1>A walk through what we envision.</h1>
    <p>The pieces below are Kingsbridge concept work &mdash; a design direction,
      not completed projects. Real project profiles will replace them here as
      they&rsquo;re confirmed, across Toronto, the GTA, and Southern Ontario.</p>
  </div>
</section>

<div class="cinema-stack" id="cinema-stack"></div>

<div id="footer-root"></div>

<script src="/assets/js/projects-data.js"></script>
<script src="/assets/js/include.js"></script>
<script src="/assets/js/main.js"></script>
<script src="/assets/js/experience.js"></script>
<script>
  document.addEventListener('partials:ready', function () {
    var stack = document.getElementById('cinema-stack');
    if (!stack || typeof KB_PROJECTS === 'undefined') return;
    stack.innerHTML = KB_PROJECTS.map(function (p, idx) {
      var align = idx % 2 === 1 ? ' align-right' : '';
      return '<a class="cinema-panel' + align + '" href="/projects/project.html?slug=' + p.slug + '" data-reveal>' +
        '<span class="cinema-index">' + String(idx + 1).padStart(2, '0') + ' / ' + String(KB_PROJECTS.length).padStart(2, '0') + '</span>' +
        '<div class="ph-photo" data-label="' + p.photoLabel + '"><img src="' + p.image + '" alt="' + p.title + '" loading="lazy"></div>' +
        '<div class="cinema-copy">' +
        '<span class="eyebrow">' + p.category + '</span>' +
        '<h3>' + p.title + '</h3>' +
        '<p class="desc">' + p.description + '</p>' +
        '<div class="cinema-features">' + p.features.map(function (f) { return '<span>' + f + '</span>'; }).join('') + '</div>' +
        '<span class="text-link" style="color:var(--ivory)">Explore Concept →</span>' +
        '</div></a>';
    }).join('');
    initScrollReveal();
  });
</script>
</body>
