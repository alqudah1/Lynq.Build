<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Kingsbridge Group</title>
<meta name="description" content="Contact Kingsbridge Group about a custom home or commercial property management inquiry.">
<link rel="canonical" href="https://www.kingsbridgegroup.ca/contact/">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png">
<link rel="shortcut icon" href="/assets/img/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#0E0E0E">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kingsbridge Group">
<meta property="og:title" content="Contact Kingsbridge Group">
<meta property="og:description" content="Contact Kingsbridge Group about a custom home or commercial property management inquiry.">
<meta property="og:url" content="https://www.kingsbridgegroup.ca/contact/">
<meta property="og:image" content="https://www.kingsbridgegroup.ca/assets/img/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Contact Kingsbridge Group">
<meta name="twitter:description" content="Contact Kingsbridge Group about a custom home or commercial property management inquiry.">
<meta name="twitter:image" content="https://www.kingsbridgegroup.ca/assets/img/og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/experience.css">
<link rel="preload" href="/partials/header.html" as="fetch" crossorigin>
<link rel="preload" href="/partials/footer.html" as="fetch" crossorigin>
</head>
<body data-page="contact">
<div class="page-veil" id="page-veil"><div class="pv-inner"><img class="pv-mark" src="/assets/img/logo/kingsbridge-icon.png" alt=""><span class="pv-line"></span></div></div>

<div id="header-root"></div>

<section class="page-header">
  <div class="container">
    <span class="eyebrow">Contact Kingsbridge</span>
    <h1>Tell us about your project or commercial property.</h1>
    <p>Submit the form below. Your inquiry will be emailed directly to the Kingsbridge team for follow-up.</p>
  </div>
</section>

<section class="section">
  <div class="container contact-layout">
    <div class="contact-layout-main">
      <div class="path-pills" id="path-pills">
        <button class="path-pill" data-path="custom-home">Custom Home Inquiry</button>
        <button class="path-pill" data-path="commercial-management">Commercial Property Management Inquiry</button>
        <button class="path-pill" data-path="general">General Inquiry</button>
      </div>

      <p class="form-intro" id="form-intro"></p>

      <form class="inquiry-form" id="inquiry-form">
        <div class="hp-field" aria-hidden="true">
          <label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off">
        </div>
        <div class="row-2">
          <div class="field"><label for="name">Full Name</label><input id="name" name="name" required></div>
          <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
        </div>
        <div class="row-2">
          <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
          <div class="field dyn-fields" data-group="commercial-management">
            <label for="cm-company">Company (if applicable)</label><input id="cm-company" name="cm-company">
          </div>
        </div>

        <!-- ===== Custom Home Inquiry ===== -->
        <div class="dyn-fields" data-group="custom-home">
          <div class="row-2">
            <div class="field"><label for="ch-location">Project Location</label><input id="ch-location" name="ch-location"></div>
            <div class="field"><label for="ch-type">Project Type</label>
              <select id="ch-type" name="ch-type"><option value="">Select one</option>
                <option>New Custom Home</option><option>Teardown &amp; Rebuild</option><option>Full Renovation</option><option>Vacant Lot Build</option>
              </select>
            </div>
          </div>
          <div class="row-2">
            <div class="field"><label for="ch-timing">Timeline</label>
              <select id="ch-timing" name="ch-timing"><option value="">Select one</option>
                <option>Just Exploring</option><option>0 to 6 Months</option><option>6 to 12 Months</option><option>12+ Months</option>
              </select>
            </div>
            <div></div>
          </div>
        </div>

        <!-- ===== Commercial Property Management Inquiry ===== -->
        <div class="dyn-fields" data-group="commercial-management">
          <div class="row-2">
            <div class="field"><label for="cm-location">Property Location</label><input id="cm-location" name="cm-location"></div>
            <div class="field"><label for="cm-type">Property Type</label>
              <select id="cm-type" name="cm-type"><option value="">Select one</option>
                <option>Commercial Plaza</option><option>Retail</option><option>Office</option><option>Other Commercial</option>
              </select>
            </div>
          </div>
          <div class="row-2">
            <div class="field"><label for="cm-size">Approximate Size / Units</label><input id="cm-size" name="cm-size" placeholder="e.g. 12,000 sq ft, or number of units"></div>
            <div class="field"><label for="cm-needs">Support Needed</label>
              <select id="cm-needs" name="cm-needs"><option value="">Select one</option>
                <option>Full Property Management</option><option>Maintenance Coordination Only</option><option>Tenant Communication Only</option><option>Not Sure Yet</option>
              </select>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="message">Tell us more</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <div>
          <button class="btn btn-solid" type="submit">Send Inquiry
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>

    <aside class="contact-layout-aside">
      <span class="contact-aside-label">Our Offices</span>
      <div class="contact-details on-ivory" id="contact-page-details"></div>
    </aside>
  </div>
</section>

<div id="footer-root"></div>

<script src="/assets/js/site-config.js" defer></script>
<script src="/assets/js/include.js" defer></script>
<script src="/assets/js/main.js" defer></script>
<script src="/assets/js/experience.js" defer></script>
<script>
  var PATH_LABELS = {
    'custom-home': 'Custom Home Inquiry',
    'commercial-management': 'Commercial Property Management Inquiry',
    'general': 'General Inquiry'
  };
  var PATH_INTROS = {
    'custom-home': 'Tell us about the home you want to build. More detail helps us respond faster.',
    'commercial-management': 'Tell us about the commercial property you&rsquo;d like managed.',
    'general': 'Tell us what&rsquo;s on your mind, and we&rsquo;ll route it to the right person.'
  };

  function setPath(selected) {
    document.querySelectorAll('.path-pill').forEach(function (p) {
      p.classList.toggle('selected', p.getAttribute('data-path') === selected);
    });
    document.querySelectorAll('.dyn-fields').forEach(function (g) {
      g.classList.toggle('active', g.getAttribute('data-group') === selected);
    });
    document.getElementById('form-intro').innerHTML = PATH_INTROS[selected] || '';
  }

  document.addEventListener('partials:ready', function () {
    var requested = new URLSearchParams(location.search).get('path');
    // Keep older custom-home and commercial-management links working without
    // exposing any additional inquiry categories.
    var legacyMap = {
      'build': 'custom-home', 'build-home': 'custom-home', 'renovate': 'custom-home',
      'manage': 'commercial-management', 'manage-property': 'commercial-management',
      'commercial': 'commercial-management'
    };
    var normalized = legacyMap[requested] || requested;
    var selected = PATH_LABELS[normalized] ? normalized : 'general';
    setPath(selected);
    document.querySelectorAll('.path-pill').forEach(function (p) {
      p.addEventListener('click', function () { setPath(p.getAttribute('data-path')); });
    });

    // Real contact details render only once confirmed (assets/js/site-config.js) — never fabricated.
    var details = document.getElementById('contact-page-details');
    if (details && typeof KB_CONFIG !== 'undefined') {
      var rows = [];
      if (KB_CONFIG.phone) rows.push('<a href="tel:' + KB_CONFIG.phone.replace(/[^\d+]/g, '') + '">' + KB_CONFIG.phone + '</a>');
      (KB_CONFIG.offices || []).forEach(function (o) { if (o.address) rows.push('<span class="office"><span class="office-label">' + o.label + '</span><span class="office-address">' + o.address + '</span></span>'); });
      if (rows.length) details.innerHTML = rows.join('');
    }
  });

  document.getElementById('inquiry-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!e.currentTarget.reportValidity()) return;
    var selected = document.querySelector('.path-pill.selected');
    var selectedPath = selected ? selected.getAttribute('data-path') : 'general';
    var inquiryType = selected ? PATH_LABELS[selected.getAttribute('data-path')] : PATH_LABELS.general;
    var data = new FormData(e.currentTarget);
    var payload = { inquiryType: inquiryType };
    data.forEach(function (value, key) { payload[key] = String(value || '').trim(); });
    var button = e.currentTarget.querySelector('button[type="submit"]');
    var status = document.getElementById('form-status');
    var originalButton = button.innerHTML;
    button.disabled = true;
    button.textContent = 'Sending...';
    status.className = 'form-status';
    status.textContent = '';
    try {
      var response = await fetch('https://lynq-build.vercel.app/api/kingsbridge-contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      var result = await response.json().catch(function () { return {}; });
      if (!response.ok) throw new Error(result.error || 'Unable to send your inquiry.');
      e.currentTarget.reset();
      setPath(selectedPath);
      status.className = 'form-status success';
      status.textContent = 'Thank you. Your inquiry has been emailed directly to Kingsbridge.';
    } catch (error) {
      status.className = 'form-status error';
      var subject = encodeURIComponent('Kingsbridge — ' + inquiryType);
      var body = encodeURIComponent(
        'Name: ' + (payload.name || '') + '\n' +
        'Email: ' + (payload.email || '') + '\n' +
        'Phone: ' + (payload.phone || '') + '\n\n' +
        (payload.message || '')
      );
      status.innerHTML = 'Automatic delivery is temporarily unavailable. <a href="mailto:admin@kingsbridgegroup.ca?subject=' + subject + '&amp;body=' + body + '">Email Kingsbridge directly</a>.';
    } finally {
      button.disabled = false;
      button.innerHTML = originalButton;
    }
  });
</script>
</body>
</html>
