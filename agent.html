<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYNQ Builder — Build anything with AI</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --bg-card: #111111;
  --bg-raised: #161616;
  --border: #1a1a1a;
  --border-light: #2a2a2a;
  --text: #e8e8e8;
  --text-dim: #555;
  --white: #ffffff;
  --green: #22c55e;
  --red: #ef4444;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.nav-logo { font-size: 0.95rem; font-weight: 700; letter-spacing: -0.3px; color: var(--white); text-decoration: none; }
.nav-right { display: flex; align-items: center; gap: 16px; }
.nav-back { font-size: 0.8rem; color: var(--text-dim); text-decoration: none; transition: color 0.2s; }
.nav-back:hover { color: var(--white); }
.nav-badge {
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
  padding: 3px 8px; border-radius: 4px;
  background: rgba(255,255,255,0.06); color: var(--text-dim);
  border: 1px solid var(--border-light);
}

/* ── LAYOUT ── */
#app {
  display: flex; flex-direction: column;
  height: 100vh; padding-top: 56px;
}

/* ── PROMPT BAR ── */
#prompt-bar {
  flex-shrink: 0;
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}

.prompt-label {
  font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px;
  color: var(--text-dim); margin-bottom: 10px;
}

.prompt-row {
  display: flex; gap: 10px; align-items: flex-end;
}

#prompt-input {
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: 10px;
  padding: 12px 16px;
  font-family: inherit; font-size: 0.92rem;
  color: var(--white);
  outline: none; resize: none;
  min-height: 46px; max-height: 120px;
  line-height: 1.5;
  transition: border-color 0.2s;
}
#prompt-input:focus { border-color: #444; }
#prompt-input::placeholder { color: var(--text-dim); }

#build-btn {
  background: var(--white); color: #000;
  border: none; border-radius: 10px;
  padding: 12px 22px;
  font-family: inherit; font-size: 0.88rem; font-weight: 600;
  cursor: pointer; white-space: nowrap;
  transition: opacity 0.15s, transform 0.1s;
  height: 46px; display: flex; align-items: center; gap: 6px;
}
#build-btn:hover { opacity: 0.88; }
#build-btn:active { transform: scale(0.97); }
#build-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

/* ── STATUS BAR ── */
#status-bar {
  flex-shrink: 0;
  padding: 10px 24px;
  display: none;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-raised);
  min-height: 44px;
}

#status-bar.show { display: flex; }

.status-dot-wrap { display: flex; align-items: center; gap: 6px; }
.s-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.s-dot.building { background: var(--white); animation: sdot 1s ease-in-out infinite; }
.s-dot.done { background: var(--green); }
.s-dot.error { background: var(--red); }

@keyframes sdot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.7); } }

#status-text { font-size: 0.85rem; color: var(--text); }
#status-prompt { font-size: 0.85rem; color: var(--text-dim); }

.status-actions { margin-left: auto; display: flex; gap: 8px; }

.btn-sm {
  background: transparent; border: 1px solid var(--border-light);
  border-radius: 6px; padding: 5px 12px;
  font-family: inherit; font-size: 0.78rem; color: var(--text-dim);
  cursor: pointer; transition: border-color 0.2s, color 0.2s;
}
.btn-sm:hover { border-color: #555; color: var(--white); }

/* ── RESULT AREA ── */
#result-area {
  flex: 1;
  position: relative;
  overflow: hidden;
}

/* ── EMPTY STATE ── */
#empty-state {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 40px 24px;
  gap: 0;
}

.empty-orb {
  width: 300px; height: 300px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
  position: absolute; pointer-events: none;
  animation: eorb 6s ease-in-out infinite;
}
@keyframes eorb { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.6; } }

.empty-icon { font-size: 2.5rem; margin-bottom: 20px; }

.empty-title {
  font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px;
  color: var(--white); margin-bottom: 10px;
}

.empty-sub { font-size: 0.9rem; color: var(--text-dim); line-height: 1.6; max-width: 360px; margin-bottom: 32px; }

.example-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

.chip {
  background: var(--bg-card); border: 1px solid var(--border-light);
  border-radius: 100px; padding: 8px 16px;
  font-family: inherit; font-size: 0.82rem; color: var(--text-dim);
  cursor: pointer; transition: border-color 0.2s, color 0.2s;
}
.chip:hover { border-color: #555; color: var(--white); }

/* ── LOADING STATE ── */
#loading-state {
  display: none;
  position: absolute; inset: 0;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 32px; padding: 40px;
}

#loading-state.show { display: flex; }

.loading-animation {
  display: flex; flex-direction: column; align-items: center; gap: 20px;
}

.loading-bars {
  display: flex; gap: 5px; align-items: flex-end; height: 28px;
}
.bar {
  width: 4px; border-radius: 2px; background: var(--white);
  animation: barPulse 1.2s ease-in-out infinite;
}
.bar:nth-child(1) { height: 12px; animation-delay: 0s; }
.bar:nth-child(2) { height: 20px; animation-delay: 0.15s; }
.bar:nth-child(3) { height: 28px; animation-delay: 0.3s; }
.bar:nth-child(4) { height: 20px; animation-delay: 0.45s; }
.bar:nth-child(5) { height: 12px; animation-delay: 0.6s; }

@keyframes barPulse {
  0%,100% { opacity: 0.2; transform: scaleY(0.6); }
  50% { opacity: 1; transform: scaleY(1); }
}

#loading-msg {
  font-size: 1rem; font-weight: 500; color: var(--white);
  transition: opacity 0.4s;
}

.loading-prompt-tag {
  font-size: 0.82rem; color: var(--text-dim);
  padding: 6px 14px; border-radius: 100px;
  background: var(--bg-card); border: 1px solid var(--border);
}

/* ── RESULT STATE ── */
#result-state {
  display: none;
  position: absolute; inset: 0;
  flex-direction: column;
}

#result-state.show { display: flex; }

.result-header {
  flex-shrink: 0; padding: 12px 24px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}

.result-ready {
  display: flex; align-items: center; gap: 7px;
  font-size: 0.85rem; font-weight: 600; color: var(--white);
}

.result-ready-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

.result-btns { display: flex; gap: 8px; margin-left: auto; }

#preview-frame {
  flex: 1; width: 100%; border: none;
  background: #fff;
}

/* ── ERROR STATE ── */
#error-state {
  display: none;
  position: absolute; inset: 0;
  align-items: center; justify-content: center;
  padding: 40px;
}

#error-state.show { display: flex; }

.error-card {
  background: var(--bg-card); border: 1px solid #2a1a1a;
  border-radius: 16px; padding: 36px;
  text-align: center; max-width: 420px; width: 100%;
}

.error-icon { font-size: 2rem; margin-bottom: 16px; }
.error-title { font-size: 1.1rem; font-weight: 600; color: var(--white); margin-bottom: 8px; }
.error-sub { font-size: 0.88rem; color: var(--text-dim); margin-bottom: 20px; line-height: 1.6; }

.error-prompt-tag {
  background: var(--bg); border: 1px solid var(--border-light);
  border-radius: 8px; padding: 10px 14px;
  font-size: 0.85rem; color: var(--text-dim);
  margin-bottom: 20px; font-style: italic;
}

.btn-retry {
  background: var(--white); color: #000;
  border: none; border-radius: 8px;
  padding: 11px 24px;
  font-family: inherit; font-size: 0.88rem; font-weight: 600;
  cursor: pointer; transition: opacity 0.2s;
}
.btn-retry:hover { opacity: 0.88; }

@media (max-width: 600px) {
  nav { padding: 0 16px; }
  #prompt-bar { padding: 14px 16px 12px; }
  #status-bar { padding: 8px 16px; }
  .status-actions .btn-sm:not(:first-child) { display: none; }
  .result-header { padding: 10px 16px; }
  .result-btns .btn-sm:last-child { display: none; }
}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">LYNQ</a>
  <div class="nav-right">
    <span class="nav-badge">AI Builder</span>
    <a href="/" class="nav-back">← Back</a>
  </div>
</nav>

<div id="app">

  <!-- ── PROMPT BAR ── -->
  <div id="prompt-bar">
    <div class="prompt-label">What do you want to build?</div>
    <div class="prompt-row">
      <textarea id="prompt-input" rows="1" placeholder="A soccer website, a click counter game, a portfolio page…"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();startBuild();}"
        oninput="autoResize(this)"></textarea>
      <button id="build-btn" onclick="startBuild()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1L13 7L7 13M1 7H13" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Build
      </button>
    </div>
  </div>

  <!-- ── STATUS BAR ── -->
  <div id="status-bar">
    <div class="status-dot-wrap">
      <div class="s-dot" id="s-dot"></div>
      <span id="status-text">Building…</span>
    </div>
    <span id="status-prompt"></span>
    <div class="status-actions" id="status-actions"></div>
  </div>

  <!-- ── RESULT AREA ── -->
  <div id="result-area">

    <!-- EMPTY -->
    <div id="empty-state">
      <div class="empty-orb"></div>
      <div class="empty-icon">⚡</div>
      <div class="empty-title">Build anything</div>
      <p class="empty-sub">Type what you want and hit Build. The AI generates a working page instantly.</p>
      <div class="example-chips">
        <button class="chip" onclick="setPrompt('A landing page for a coffee shop')">Coffee shop landing page</button>
        <button class="chip" onclick="setPrompt('A simple click counter game')">Click counter game</button>
        <button class="chip" onclick="setPrompt('A personal portfolio website')">Portfolio website</button>
        <button class="chip" onclick="setPrompt('A restaurant menu page')">Restaurant menu</button>
        <button class="chip" onclick="setPrompt('A countdown timer to New Year')">Countdown timer</button>
      </div>
    </div>

    <!-- LOADING -->
    <div id="loading-state">
      <div class="loading-animation">
        <div class="loading-bars">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div>
        </div>
        <div id="loading-msg">Generating your page…</div>
      </div>
      <div class="loading-prompt-tag" id="loading-prompt-tag"></div>
    </div>

    <!-- RESULT -->
    <div id="result-state">
      <div class="result-header">
        <div class="result-ready">
          <div class="result-ready-dot"></div>
          Your build is ready
        </div>
        <div class="result-btns">
          <button class="btn-sm" onclick="rebuild()">↺ Rebuild</button>
          <button class="btn-sm" onclick="editPrompt()">✎ Edit prompt</button>
          <button class="btn-sm" onclick="explainBuild()">? Explain this</button>
        </div>
      </div>
      <iframe id="preview-frame" sandbox="allow-scripts allow-forms allow-modals" title="Build preview"></iframe>
    </div>

    <!-- ERROR -->
    <div id="error-state">
      <div class="error-card">
        <div class="error-icon">⚠</div>
        <div class="error-title">We couldn't build that yet.</div>
        <p class="error-sub">Try a simpler idea, or rephrase your request.</p>
        <div class="error-prompt-tag" id="error-prompt-tag"></div>
        <button class="btn-retry" onclick="retryBuild()">Try again</button>
      </div>
    </div>

  </div>
</div>

<script>
const LOADING_MESSAGES = [
  'Generating your page…',
  'Building your project…',
  'Writing the code…',
  'Almost ready…',
  'Putting the finishing touches…',
];

let currentPrompt = '';
let lastCode = '';
let msgTimer = null;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function setPrompt(text) {
  const input = document.getElementById('prompt-input');
  input.value = text;
  autoResize(input);
  input.focus();
}

function setState(name) {
  ['empty-state','loading-state','result-state','error-state'].forEach(id => {
    const el = document.getElementById(id);
    el.style.display = 'none';
    el.classList.remove('show');
  });
  const target = document.getElementById(name);
  if (target) {
    target.style.display = 'flex';
    target.classList.add('show');
  }
}

function setStatus(type, text, prompt) {
  const bar = document.getElementById('status-bar');
  const dot = document.getElementById('s-dot');
  const statusText = document.getElementById('status-text');
  const statusPrompt = document.getElementById('status-prompt');

  bar.classList.add('show');
  dot.className = 's-dot ' + type;
  statusText.textContent = text;
  statusPrompt.textContent = prompt ? `"${prompt}"` : '';
}

function clearStatus() {
  document.getElementById('status-bar').classList.remove('show');
}

function cycleLoadingMessages() {
  let i = 0;
  const el = document.getElementById('loading-msg');
  msgTimer = setInterval(() => {
    i = (i + 1) % LOADING_MESSAGES.length;
    el.style.opacity = '0';
    setTimeout(() => {
      el.textContent = LOADING_MESSAGES[i];
      el.style.opacity = '1';
    }, 200);
  }, 2200);
}

function stopLoadingMessages() {
  if (msgTimer) { clearInterval(msgTimer); msgTimer = null; }
}

async function startBuild() {
  const input = document.getElementById('prompt-input');
  const prompt = input.value.trim();
  if (!prompt) { input.focus(); return; }

  currentPrompt = prompt;

  // UI: disable build button
  const btn = document.getElementById('build-btn');
  btn.disabled = true;

  // Show loading
  setState('loading-state');
  document.getElementById('loading-prompt-tag').textContent = prompt;
  document.getElementById('loading-msg').textContent = LOADING_MESSAGES[0];
  setStatus('building', 'Building…', prompt);
  cycleLoadingMessages();

  try {
    const res = await fetch('/api/build', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt }),
    });

    stopLoadingMessages();

    if (!res.ok) throw new Error(`API returned ${res.status}`);

    // Collect streamed HTML
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let rawCode = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value);
      const lines = chunk.split('\n');
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const d = JSON.parse(line.slice(6));
            if (d.text) rawCode += d.text;
          } catch {}
        }
      }
    }

    // Extract HTML — look for <!DOCTYPE or <html
    const htmlMatch = rawCode.match(/(<!DOCTYPE[\s\S]*)/i) || rawCode.match(/(<html[\s\S]*)/i);
    const html = htmlMatch ? htmlMatch[1] : rawCode.trim();

    if (!html || html.length < 50) throw new Error('Empty or invalid response');

    lastCode = html;
    showResult(html);
    setStatus('done', 'Build complete', prompt);

  } catch (err) {
    stopLoadingMessages();
    showError(prompt);
    clearStatus();
  }

  btn.disabled = false;
}

function showResult(html) {
  setState('result-state');
  const frame = document.getElementById('preview-frame');
  // Only inject once we have valid HTML — prevents blank white screen
  frame.removeAttribute('srcdoc');
  frame.srcdoc = html;

  // Update status actions
  document.getElementById('status-actions').innerHTML = `
    <button class="btn-sm" onclick="rebuild()">↺ Rebuild</button>
    <button class="btn-sm" onclick="editPrompt()">✎ Edit</button>
  `;
}

function showError(prompt) {
  setState('error-state');
  document.getElementById('error-prompt-tag').textContent = `"${prompt}"`;
}

function rebuild() {
  if (!currentPrompt) return;
  document.getElementById('prompt-input').value = currentPrompt;
  startBuild();
}

function editPrompt() {
  setState('empty-state');
  clearStatus();
  const input = document.getElementById('prompt-input');
  input.value = currentPrompt;
  autoResize(input);
  input.focus();
  input.select();
}

function retryBuild() {
  if (!currentPrompt) { setState('empty-state'); return; }
  document.getElementById('prompt-input').value = currentPrompt;
  startBuild();
}

function explainBuild() {
  // Placeholder — could open a chat panel or modal
  alert('Explain feature coming soon.');
}

// Init
setState('empty-state');
document.getElementById('prompt-input').focus();
</script>
</body>
</html>
