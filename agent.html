<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYNQ AI — Let's Talk About Your Business</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --bg-card: #111111;
  --bg-msg: #161616;
  --border: #1a1a1a;
  --border-light: #2a2a2a;
  --text: #e8e8e8;
  --text-dim: #666;
  --white: #ffffff;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: 20px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 50;
  border-bottom: 1px solid transparent;
  transition: border-color 0.3s;
}
nav.scrolled { border-color: var(--border); }
.nav-logo { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.5px; color: var(--white); text-decoration: none; }
.nav-back { font-size: 0.83rem; color: var(--text-dim); text-decoration: none; transition: color 0.2s; }
.nav-back:hover { color: var(--white); }

/* ── LANDING ── */
#landing {
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 24px;
  position: relative;
  transition: opacity 0.5s, transform 0.5s;
}

#landing.hide {
  opacity: 0;
  pointer-events: none;
  transform: translateY(-24px);
}

/* Orb */
.orb {
  position: absolute;
  width: 600px;
  height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, rgba(255,255,255,0.04) 0%, transparent 70%);
  filter: blur(60px);
  pointer-events: none;
  animation: orbFloat 8s ease-in-out infinite;
}

@keyframes orbFloat {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(30px, -20px) scale(1.05); }
  66% { transform: translate(-20px, 15px) scale(0.97); }
}

.landing-tag {
  font-size: 0.78rem;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 24px;
}

.landing-heading {
  font-size: clamp(2.4rem, 6vw, 4.5rem);
  font-weight: 700;
  letter-spacing: -2px;
  line-height: 1.05;
  color: var(--white);
  margin-bottom: 20px;
  max-width: 700px;
}

.landing-sub {
  font-size: 1rem;
  color: var(--text-dim);
  max-width: 440px;
  line-height: 1.7;
  margin-bottom: 48px;
}

.btn-start {
  background: var(--white);
  color: #000;
  border: none;
  border-radius: 100px;
  padding: 16px 36px;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
  position: relative;
  z-index: 1;
}

.btn-start:hover {
  opacity: 0.92;
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(255,255,255,0.1);
}

.btn-start:active { transform: translateY(0); }

/* ── CHAT ── */
#chat-wrap {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transform: translateY(24px);
  transition: opacity 0.5s 0.1s, transform 0.5s 0.1s;
}

#chat-wrap.show {
  opacity: 1;
  pointer-events: all;
  transform: translateY(0);
}

/* Chat header */
.chat-header {
  flex-shrink: 0;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 61px; /* nav height */
}

.agent-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--white);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; font-weight: 700; color: #000;
  flex-shrink: 0;
}

.agent-info .name { font-size: 0.92rem; font-weight: 600; color: var(--white); }
.agent-info .status { font-size: 0.75rem; color: var(--text-dim); display: flex; align-items: center; gap: 5px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 6px #22c55e; }

/* Messages */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}

#messages::-webkit-scrollbar { width: 4px; }
#messages::-webkit-scrollbar-track { background: transparent; }
#messages::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

/* Message bubbles */
.msg {
  display: flex;
  gap: 10px;
  max-width: 680px;
  animation: msgIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg.user { flex-direction: row-reverse; align-self: flex-end; }

.msg-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--bg-msg);
  border: 1px solid var(--border-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem; font-weight: 700;
  flex-shrink: 0;
  margin-top: 2px;
  color: var(--text-dim);
}

.msg.agent .msg-avatar { background: var(--white); color: #000; border: none; }

.msg-body { display: flex; flex-direction: column; gap: 4px; max-width: calc(100% - 40px); }
.msg.user .msg-body { align-items: flex-end; }

.bubble {
  background: var(--bg-msg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 12px 16px;
  font-size: 0.92rem;
  line-height: 1.65;
  color: var(--text);
  word-break: break-word;
}

.msg.user .bubble {
  background: var(--white);
  color: #000;
  border-color: transparent;
}

.msg-time {
  font-size: 0.7rem;
  color: var(--text-dim);
  padding: 0 4px;
}

/* Typing indicator */
.typing-bubble {
  background: var(--bg-msg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 18px;
  display: flex; align-items: center; gap: 4px;
}

.typing-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text-dim);
  animation: typingBounce 1.2s ease-in-out infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-5px); opacity: 1; }
}

/* Quick replies */
#quick-replies {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0 24px 12px;
  flex-shrink: 0;
}

.qr-btn {
  background: transparent;
  border: 1px solid var(--border-light);
  border-radius: 100px;
  padding: 8px 16px;
  font-family: inherit;
  font-size: 0.82rem;
  color: var(--text-dim);
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
  white-space: nowrap;
}

.qr-btn:hover {
  border-color: #555;
  color: var(--white);
  background: rgba(255,255,255,0.03);
}

/* Input */
.chat-input-wrap {
  flex-shrink: 0;
  padding: 12px 24px 24px;
  border-top: 1px solid var(--border);
}

.input-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: 14px;
  padding: 10px 12px;
  transition: border-color 0.2s;
}

.input-row:focus-within { border-color: #444; }

#user-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  font-family: inherit;
  font-size: 0.92rem;
  color: var(--white);
  line-height: 1.5;
  resize: none;
  max-height: 120px;
  overflow-y: auto;
}

#user-input::placeholder { color: var(--text-dim); }

.btn-send {
  width: 34px; height: 34px;
  background: var(--white);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: opacity 0.2s;
}

.btn-send:hover { opacity: 0.85; }
.btn-send:disabled { opacity: 0.3; cursor: not-allowed; }

.btn-send svg { width: 16px; height: 16px; }

@media (max-width: 600px) {
  nav { padding: 16px 20px; }
  #messages { padding: 20px 16px; }
  .chat-header { padding: 14px 16px; margin-top: 57px; }
  .chat-input-wrap { padding: 10px 16px 20px; }
  #quick-replies { padding: 0 16px 10px; }
  .landing-heading { letter-spacing: -1.5px; }
}
</style>
</head>
<body>

<!-- NAV -->
<nav id="nav">
  <a href="/" class="nav-logo">LYNQ</a>
  <a href="/" class="nav-back">← Back to site</a>
</nav>

<!-- LANDING -->
<div id="landing">
  <div class="orb"></div>
  <div class="landing-tag">AI Assistant</div>
  <h1 class="landing-heading">Let's talk about<br>your business</h1>
  <p class="landing-sub">Tell us what you do. Our AI will explain exactly how LYNQ can help you grow online.</p>
  <button class="btn-start" onclick="startChat()">Start Conversation →</button>
</div>

<!-- CHAT -->
<div id="chat-wrap">
  <div class="chat-header">
    <div class="agent-avatar">L</div>
    <div class="agent-info">
      <div class="name">LYNQ AI</div>
      <div class="status"><span class="status-dot"></span> Online</div>
    </div>
  </div>

  <div id="messages"></div>

  <div id="quick-replies"></div>

  <div class="chat-input-wrap">
    <div class="input-row">
      <textarea id="user-input" placeholder="Type a message…" rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"
        oninput="autoResize(this)"></textarea>
      <button class="btn-send" id="btn-send" onclick="sendMessage()">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 8L2 2L5 8L2 14L14 8Z" fill="#000" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
const QUICK_REPLIES_INITIAL = [
  "I need a website for my business",
  "I have a website but it's outdated",
  "I want to show up on Google",
  "Tell me about your pricing",
];

let history = [];
let isTyping = false;

function startChat() {
  document.getElementById('landing').classList.add('hide');
  const wrap = document.getElementById('chat-wrap');
  wrap.classList.add('show');
  setTimeout(() => {
    sendAgentMessage("Hey! 👋 I'm LYNQ's AI assistant. I'm here to help you figure out exactly how we can help grow your business online.\n\nWhat kind of business do you run?");
    setQuickReplies(QUICK_REPLIES_INITIAL);
    document.getElementById('user-input').focus();
  }, 300);
}

function setQuickReplies(options) {
  const el = document.getElementById('quick-replies');
  el.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn';
    btn.textContent = opt;
    btn.onclick = () => {
      document.getElementById('user-input').value = opt;
      sendMessage();
    };
    el.appendChild(btn);
  });
}

function clearQuickReplies() {
  document.getElementById('quick-replies').innerHTML = '';
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function timeStr() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function sendAgentMessage(text) {
  const el = document.getElementById('messages');
  const msg = document.createElement('div');
  msg.className = 'msg agent';
  msg.innerHTML = `
    <div class="msg-avatar">L</div>
    <div class="msg-body">
      <div class="bubble">${text.replace(/\n/g, '<br>')}</div>
      <div class="msg-time">${timeStr()}</div>
    </div>`;
  el.appendChild(msg);
  el.scrollTop = el.scrollHeight;
  history.push({ role: 'assistant', content: text });
}

function appendStreamingMessage() {
  const el = document.getElementById('messages');
  const msg = document.createElement('div');
  msg.className = 'msg agent';
  msg.innerHTML = `
    <div class="msg-avatar">L</div>
    <div class="msg-body">
      <div class="bubble" id="streaming-bubble"></div>
      <div class="msg-time">${timeStr()}</div>
    </div>`;
  el.appendChild(msg);
  el.scrollTop = el.scrollHeight;
  return document.getElementById('streaming-bubble');
}

function showTyping() {
  const el = document.getElementById('messages');
  const typing = document.createElement('div');
  typing.className = 'msg agent';
  typing.id = 'typing-msg';
  typing.innerHTML = `
    <div class="msg-avatar">L</div>
    <div class="msg-body">
      <div class="typing-bubble">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>`;
  el.appendChild(typing);
  el.scrollTop = el.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing-msg');
  if (t) t.remove();
}

async function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text || isTyping) return;

  clearQuickReplies();

  // User message
  const el = document.getElementById('messages');
  const msg = document.createElement('div');
  msg.className = 'msg user';
  msg.innerHTML = `
    <div class="msg-avatar">U</div>
    <div class="msg-body">
      <div class="bubble">${text.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}</div>
      <div class="msg-time">${timeStr()}</div>
    </div>`;
  el.appendChild(msg);
  el.scrollTop = el.scrollHeight;

  history.push({ role: 'user', content: text });
  input.value = '';
  input.style.height = 'auto';
  input.blur();

  isTyping = true;
  document.getElementById('btn-send').disabled = true;
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });

    hideTyping();

    if (!res.ok) throw new Error('API error');

    // Handle streaming
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    const bubble = appendStreamingMessage();
    let fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value);
      const lines = chunk.split('\n');
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const d = JSON.parse(line.slice(6));
            if (d.text) {
              fullText += d.text;
              bubble.innerHTML = fullText.replace(/\n/g, '<br>');
              el.scrollTop = el.scrollHeight;
            }
          } catch {}
        }
      }
    }

    if (fullText) {
      history.push({ role: 'assistant', content: fullText });
      // Set contextual quick replies after first exchange
      if (history.length <= 4) {
        setQuickReplies(['Tell me more', 'How much does it cost?', 'Book a free call', 'See examples']);
      }
    }

  } catch (err) {
    hideTyping();
    sendAgentMessage("Sorry, I ran into an issue. Please try again or reach us directly at lynq.build.");
  }

  isTyping = false;
  document.getElementById('btn-send').disabled = false;
  document.getElementById('user-input').focus();
}
</script>
</body>
</html>
